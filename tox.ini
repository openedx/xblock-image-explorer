[tox]
envlist = py312-django{42,52},quality,package
requires = tox-uv>=1

[pytest]
DJANGO_SETTINGS_MODULE = workbench.settings
addopts = --cov-report term-missing --cov-report xml --cov=image_explorer

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
allowlist_externals =
    make
commands =
    make test

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
allowlist_externals =
    make
commands =
    make quality

[testenv:package]
runner = uv-venv-lock-runner
dependency_groups = package
commands =
    python -m build
    twine check dist/*
